name: Build Windows EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install OpenCV 4.5.5
      shell: pwsh
      run: |
        $url = "https://github.com/opencv/opencv/releases/download/4.5.5/opencv-4.5.5-vc14_vc15.exe"
        $out = "$env:RUNNER_TEMP\opencv.exe"
        Invoke-WebRequest -Uri $url -OutFile $out
        7z x $out -oC:\ -y | Out-Null
        echo "OpenCV_DIR=C:\opencv\build" >> $env:GITHUB_ENV
        echo "C:\opencv\build\x64\vc15\bin" >> $env:GITHUB_PATH

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR=C:/opencv/build

    - name: Build
      run: cmake --build build --config Release

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchScanCleaner-Windows
        path: build/bin/Release/