name: Build Windows EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: vcpkg-tesseract-v2-${{ runner.os }}

    - name: Setup vcpkg and Install Tesseract
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        cd $env:GITHUB_WORKSPACE
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout a1a1cbc975abf909a6c8985a6a2b8fe20bbd9bd6
        ./bootstrap-vcpkg.bat -disableMetrics
        ./vcpkg install tesseract:x64-windows
        echo "vcpkg install done"

    - name: Setup vcpkg (cache hit)
      if: steps.cache-vcpkg.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        Write-Host "vcpkg restored from cache"
        Get-ChildItem "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin" | Select-Object -First 5

    - name: Export vcpkg env
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

    - name: Install OpenCV 4.5.5
      shell: pwsh
      run: |
        $url = "https://github.com/opencv/opencv/releases/download/4.5.5/opencv-4.5.5-vc14_vc15.exe"
        $out = "$env:RUNNER_TEMP\opencv.exe"
        Invoke-WebRequest -Uri $url -OutFile $out
        & 7z x $out "-oC:\" -y
        $config = "C:\opencv\build\x64\vc15\lib"
        if (-not (Test-Path "$config\OpenCVConfig.cmake")) { Write-Error "not found"; exit 1 }
        echo "OpenCV_DIR=$config" >> $env:GITHUB_ENV
        echo "$config" >> $env:GITHUB_PATH
        echo "C:\opencv\build\x64\vc15\bin" >> $env:GITHUB_PATH

    - name: Install Qt 5.14.2
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.14.2'
        arch: 'win64_msvc2017_64'
        cache: true

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: cmake --build build --config Release

    - name: Bundle OpenCV DLL
      shell: pwsh
      run: |
        Copy-Item "C:\opencv\build\x64\vc15\bin\opencv_world455.dll" -Destination "build\bin\Release\" -Force
        Copy-Item "C:\opencv\build\x64\vc15\bin\opencv_videoio_ffmpeg455_64.dll" -Destination "build\bin\Release\" -Force -ErrorAction SilentlyContinue

    - name: Bundle Tesseract DLL and tessdata
      shell: pwsh
      run: |
        $vcpkgBin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
        if (Test-Path $vcpkgBin) {
          Copy-Item "$vcpkgBin\*.dll" -Destination "build\bin\Release\" -Force -ErrorAction SilentlyContinue
        }
        New-Item -ItemType Directory -Path "build\bin\Release\tessdata" -Force | Out-Null
        $tessdataSrc = "$env:VCPKG_ROOT\installed\x64-windows\share\tessdata"
        if (Test-Path $tessdataSrc) {
          Copy-Item "$tessdataSrc\*" -Destination "build\bin\Release\tessdata\" -Force -ErrorAction SilentlyContinue
        }
        if (-not (Test-Path "build\bin\Release\tessdata\eng.traineddata")) {
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "build\bin\Release\tessdata\eng.traineddata"
        }

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchScanCleaner-Windows
        path: build/bin/Release/
        compression-level: 0

    - name: Publish to Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: build/bin/Release/BatchScanCleaner.exe
        generate_release_notes: false