name: Build Windows EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'a1a1cbc975abf909a6c8985a6a2b8fe20bbd9bd6'

    - name: Install OpenCV 4.5.5
      shell: pwsh
      run: |
        $url = "https://github.com/opencv/opencv/releases/download/4.5.5/opencv-4.5.5-vc14_vc15.exe"
        $out = "$env:RUNNER_TEMP\opencv.exe"
        Invoke-WebRequest -Uri $url -OutFile $out
        & 7z x $out "-oC:\" -y
        $config = "C:\opencv\build\x64\vc15\lib"
        if (-not (Test-Path "$config\OpenCVConfig.cmake")) { Write-Error "not found"; exit 1 }
        echo "OpenCV_DIR=$config" >> $env:GITHUB_ENV
        echo "$config" >> $env:GITHUB_PATH
        echo "C:\opencv\build\x64\vc15\bin" >> $env:GITHUB_PATH

    - name: Install Qt 5.14.2
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.14.2'
        arch: 'win64_msvc2017_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release

    - name: Bundle OpenCV DLL
      shell: pwsh
      run: |
        Copy-Item "C:\opencv\build\x64\vc15\bin\opencv_world455.dll" -Destination "build\bin\Release\" -Force
        Copy-Item "C:\opencv\build\x64\vc15\bin\opencv_videoio_ffmpeg455_64.dll" -Destination "build\bin\Release\" -Force -ErrorAction SilentlyContinue

    - name: Bundle Tesseract DLL and tessdata
      shell: pwsh
      run: |
        $vcpkgBin = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin"
        Copy-Item "$vcpkgBin\*.dll" -Destination "build\bin\Release\" -Force -ErrorAction SilentlyContinue
        $tessdataSrc = "${{ env.VCPKG_ROOT }}\installed\x64-windows\share\tessdata"
        if (Test-Path $tessdataSrc) {
          New-Item -ItemType Directory -Path "build\bin\Release\tessdata" -Force | Out-Null
          Copy-Item "$tessdataSrc\*" -Destination "build\bin\Release\tessdata\" -Force -ErrorAction SilentlyContinue
        }
        # 下载 eng.traineddata（如果没有现成）
        if (-not (Test-Path "build\bin\Release\tessdata\eng.traineddata")) {
          New-Item -ItemType Directory -Path "build\bin\Release\tessdata" -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "build\bin\Release\tessdata\eng.traineddata"
        }

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchScanCleaner-Windows
        path: build/bin/Release/
        compression-level: 0

    - name: Publish to Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: build/bin/Release/BatchScanCleaner.exe
        generate_release_notes: false