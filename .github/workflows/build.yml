name: Build Windows EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install OpenCV 4.5.5
      shell: pwsh
      run: |
        $url = "https://github.com/opencv/opencv/releases/download/4.5.5/opencv-4.5.5-vc14_vc15.exe"
        $out = "$env:RUNNER_TEMP\opencv.exe"
        Invoke-WebRequest -Uri $url -OutFile $out
        & 7z x $out "-oC:\" -y
        $config = "C:\opencv\build\x64\vc15\lib"
        if (-not (Test-Path "$config\OpenCVConfig.cmake")) { Write-Error "not found"; exit 1 }
        echo "OpenCV_DIR=$config" >> $env:GITHUB_ENV
        echo "$config" >> $env:GITHUB_PATH
        echo "C:\opencv\build\x64\vc15\bin" >> $env:GITHUB_PATH

    - name: Install Qt 5.14.2
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.14.2'
        arch: 'win64_msvc2017_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Bundle OpenCV DLL
      shell: pwsh
      run: |
        Copy-Item "C:\opencv\build\x64\vc15\bin\opencv_world455.dll" -Destination "build\bin\Release\" -Force
        Copy-Item "C:\opencv\build\x64\vc15\bin\opencv_videoio_ffmpeg455_64.dll" -Destination "build\bin\Release\" -Force -ErrorAction SilentlyContinue

    - name: Download Tesseract portable
      shell: pwsh
      run: |
        $url = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.3.3.20231005.exe"
        $out = "$env:RUNNER_TEMP\tesseract-setup.exe"
        Invoke-WebRequest -Uri $url -OutFile $out
        Write-Host "Downloaded: $((Get-Item $out).Length) bytes"
        
        $installDir = "C:\tesseract-portable"
        New-Item -ItemType Directory -Path $installDir -Force | Out-Null
        & 7z x $out "-o$installDir" -y
        
        $tessExe = Get-ChildItem $installDir -Recurse -Filter "tesseract.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $tessExe) {
          Write-Error "tesseract.exe not found in $installDir"
          exit 1
        }
        
        $tessDir = $tessExe.DirectoryName
        if ($tessDir -ne $installDir) {
          Get-ChildItem $tessDir -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($tessDir.Length).TrimStart('\')
            $target = Join-Path $installDir $rel
            if ($_.PSIsContainer) {
              New-Item -ItemType Directory -Path $target -Force | Out-Null
            } else {
              $targetDir = Split-Path $target -Parent
              if (-not (Test-Path $targetDir)) {
                New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
              }
              Move-Item $_.FullName -Destination $target -Force
            }
          }
        }
        
        if (-not (Test-Path "$installDir\tesseract.exe")) {
          Write-Error "tesseract.exe still not found after move"
          exit 1
        }
        Write-Host "Tesseract ready at $installDir"

    - name: Bundle Tesseract
      shell: pwsh
      run: |
        $src = "C:\tesseract-portable"
        $dst = "build\bin\Release\tesseract"
        New-Item -ItemType Directory -Path $dst -Force | Out-Null
        
        Copy-Item "$src\tesseract.exe" -Destination $dst -Force
        Get-ChildItem "$src\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $dst -Force
        
        New-Item -ItemType Directory -Path "$dst\tessdata" -Force | Out-Null
        if (Test-Path "$src\tessdata\eng.traineddata") {
          Copy-Item "$src\tessdata\eng.traineddata" -Destination "$dst\tessdata\" -Force
        }
        if (Test-Path "$src\tessdata\osd.traineddata") {
          Copy-Item "$src\tessdata\osd.traineddata" -Destination "$dst\tessdata\" -Force
        }
        
        if (-not (Test-Path "$dst\tessdata\eng.traineddata")) {
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "$dst\tessdata\eng.traineddata"
        }
        
        Write-Host "Tesseract bundled:"
        Get-ChildItem $dst | Select-Object Name

    - name: Prepare portable zip
      shell: pwsh
      run: |
        # 收集所有需要打包的文件
        $bundleDir = "bundle-portable"
        New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
        
        # 复制 exe
        Copy-Item "build\bin\Release\BatchScanCleaner.exe" -Destination $bundleDir -Force
        
        # 复制 OpenCV DLL
        Copy-Item "build\bin\Release\opencv_world455.dll" -Destination $bundleDir -Force
        Copy-Item "build\bin\Release\opencv_videoio_ffmpeg455_64.dll" -Destination $bundleDir -Force -ErrorAction SilentlyContinue
        
        # 复制 tesseract 整个目录
        Copy-Item "build\bin\Release\tesseract" -Destination "$bundleDir\tesseract" -Recurse -Force
        
        Write-Host "Bundle contents:"
        Get-ChildItem $bundleDir | Select-Object Name
        
        # 压缩为 zip
        Compress-Archive -Path "$bundleDir\*" -DestinationPath "BatchScanCleaner-Portable.zip" -Force
        
        Write-Host "Zip created: $((Get-Item 'BatchScanCleaner-Portable.zip').Length) bytes"

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchScanCleaner-Windows
        path: build/bin/Release/
        compression-level: 0

    - name: Upload Portable zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchScanCleaner-Portable
        path: BatchScanCleaner-Portable.zip

    - name: Publish to Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: |
          build/bin/Release/BatchScanCleaner.exe
          BatchScanCleaner-Portable.zip
        generate_release_notes: false